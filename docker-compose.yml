services:
  mysqldb:
    # TODO 1: Chọn image MySQL phù hợp
    image: mysql:8.0

    container_name: mysql-container

    environment:
      # TODO 2: Điền thông tin database và tài khoản
      MYSQL_DATABASE: devops_db
      MYSQL_ROOT_PASSWORD: "123456789"
      MYSQL_USER: devops_user
      MYSQL_PASSWORD: "123456789"

    ports:
      # TODO 3: Khai báo ánh xạ cổng MySQL
      - "3306:3306"

    volumes:
      # TODO 4: Khai báo volume lưu dữ liệu
      - db_data:/var/lib/mysql

    networks:
      # Tạo 1 appnet
      - exam-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s

  backend:
    # TODO 5: Khai báo image backend hoặc cấu hình build
    image: phuonganhpham/backend-app:latest #  <tên_tai_khoan_dockerhub>/backend-app:latest
    build: .
#    image: userfortest/backend-app
    container_name: backend-container

    ports:
      # TODO 6: Ánh xạ cổng ứng dụng
      - "8080:8080"

    environment:
      # TODO 7: Cấu hình kết nối Spring Boot tới MySQL (với tên db-service thay vì localhost)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/devops_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: devops_user
      SPRING_DATASOURCE_PASSWORD: "123456789"

    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - exam-network

    restart: unless-stopped

# Tài nguyên dùng chung
volumes:
  db_data:
networks:
  exam-network:


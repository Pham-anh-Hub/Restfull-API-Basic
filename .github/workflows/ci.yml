name: CI Pineline

# Tự động chạy khi có push lên nhánh main
on:
  push:
    branches: ["main"]

# Checkout source code và thiết lập JDK phù hợp.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
#      Checkout source code và thiết lập JDK phù hợp.
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

#       Build ứng dụng Spring Boot
      - name: Execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Spring Boot
        run: ./gradlew bootJar -x test


#      Đăng nhập DockerHub, Build và Púsh Docker Image
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/backend-app:latest


#       Kết nối tới VPS và triển kkhai bằng Docker Compose
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
        # có thể dùng mật khẩu thay thế và khai báo
          # password: ${{secrets.VPS_PASSWORD}}
          script: |
            cd ~/Restfull-API-Basic
            # 1. Kéo image mới nhất vừa build về VPS
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
            # 2. Khởi động lại backend với image mới
            docker compose up -d --no-deps backend
            # 3. Dọn dẹp các image cũ không còn dùng
            docker image prune -f




























# Quy trình CI/CD qua câu chuyện logic sau:
#
#  [Máy của GitHub]
#  Push code lên main
#  -> Cài Java 17
#  -> Dùng Gradle build ra file .jar
#  -> Đóng gói Docker Image
#  -> Bắn (Push) image lên Docker Hub
#  │
#  ▼ (SSH qua mạng Internet)
#  [Máy chủ VPS của bạn]
#  Nhận lệnh SSH
#  -> Kéo (Pull) image mới nhất từ Docker Hub về
#  -> docker compose up -d (Chạy phiên bản mới)
#  2. Chuẩn bị GitHub Secrets (Bắt buộc theo đề bài)

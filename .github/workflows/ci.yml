#
#Bạn vào GitHub: Repository của bạn
#  →
#  → Settings
#  →
#  → Secrets and variables
#  →
#  → Actions
#  →
#→ Bấm nút xanh New repository secret để tạo 4 biến sau:
#
#  Tên Secret	Ý nghĩa	Giá trị điền vào
#DOCKERHUB_USERNAME	Tên tài khoản Docker Hub của bạn	Ví dụ: nguyenvana
#DOCKERHUB_TOKEN	Token / Mật khẩu Docker Hub	Vào Docker Hub: Account Settings
#  →
#  → Security
#  →
#  → New Access Token (hoặc lấy chính mật khẩu Docker Hub)
#VPS_HOST	Địa chỉ IP Public của VPS	Ví dụ: 54.214.x.x (IP thật của VPS)
#  VPS_USER	Tên tài khoản trên VPS	devops_student (hoặc userfortest)
#  VPS_SSH_KEY	Khóa bí mật Private Key để SSH	Toàn bộ nội dung file .pem hoặc file id_rsa (mở bằng Notepad copy từ -----BEGIN ... đến -----END ...)
#
#  (Nếu bạn đăng nhập VPS bằng mật khẩu thường thay vì Key, có thể tạo secret VPS_PASSWORD thay cho VPS_SSH_KEY).
